[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-valve-stiction-implementation"
version = "2.0.0"
description = "Non-invasive control valve stiction experiments and SVR reference approximation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4", "scipy==1.13.1", "scikit-learn==1.5.2", "pandas==2.2.3",
    "matplotlib==3.9.2", "openpyxl==3.1.5", "Pillow==11.0.0", "joblib==1.4.2",
]

[tool.setuptools.packages.find]
include = ["stiction*"]
